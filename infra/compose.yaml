# Local PostgreSQL for EnergyIQ RD (spec 0009/0001).
#
#   cp infra/.env.example infra/.env
#   docker compose -f infra/compose.yaml up -d db
#
# The port binds to loopback only. The init scripts run only on a fresh volume.
name: energyiq

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - energyiq-pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  energyiq-pgdata:
