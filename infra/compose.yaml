# Local PostgreSQL for EnergyIQ RD (spec 0009/0001).
#
#   cp infra/.env.example infra/.env
#   docker compose -f infra/compose.yaml up -d db
#
# The port binds to loopback only. The init scripts run only on a fresh volume.
name: energyiq

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    networks: [default, internal]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - energyiq-pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Spec 0012/0002: the extraction worker. Start it with
  #   docker compose -f infra/compose.yaml --profile worker up -d worker
  # It joins only the internal network (PostgreSQL and nothing else), so it has
  # no route to the internet. It is the only container that mounts the documents.
  worker:
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: infra/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # No env_file: that file holds the PostgreSQL superuser and migrator
    # passwords. The worker gets only the app role password, interpolated below.
    environment:
      ENERGYIQ_ENV: dev
      ENERGYIQ_WORKER_ISOLATION: container
      ENERGYIQ_DOCUMENT_ROOT: /var/lib/energyiq/documents
      ENERGYIQ_DATABASE_URL: postgresql+psycopg://energyiq_app:${ENERGYIQ_APP_PASSWORD}@db:5432/energyiq_dev
      # Optional local model proposals (spec 0012/0004). Off by default and not
      # tested against a real model yet. To try it, run Ollama yourself, join it to
      # the `internal` network only (never give this worker a route to the
      # internet), pull a model, then set these and raise the lease above
      # ollama timeout times attempts, plus 35 and one per attempt:
      #   ENERGYIQ_EXTRACTION_ENABLED: "true"
      #   ENERGYIQ_OLLAMA_BASE_URL: http://ollama:11434
      #   ENERGYIQ_OLLAMA_MODEL: <your model tag>
      #   ENERGYIQ_RUN_LEASE_SECONDS: "150"
    # On Linux set ENERGYIQ_WORKER_UID to your own uid so the worker can read
    # files the API wrote. Docker Desktop (Windows, macOS) needs no change.
    user: "${ENERGYIQ_WORKER_UID:-10001}:${ENERGYIQ_WORKER_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 64
    networks: [internal]
    # The API runs on the host and writes uploads to <repo>/.local/documents
    # (the dev default of ENERGYIQ_DOCUMENT_ROOT). The worker reads that same
    # directory, read only, because it never writes documents.
    volumes:
      - type: bind
        source: ../.local/documents
        target: /var/lib/energyiq/documents
        read_only: true
        bind:
          create_host_path: true

networks:
  # No gateway: containers on it cannot reach the internet. ``db`` also stays on
  # the default network so its loopback port mapping keeps working.
  internal:
    internal: true

volumes:
  energyiq-pgdata:
