[project]
name = "energyiq-rd"
version = "0.1.0"
description = "EnergyIQ RD electricity intelligence platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170",
    "pyright>=1.1.414",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
src = ["backend/src"]
extend-exclude = [".cache", ".local-python"]
