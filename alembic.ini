# Alembic configuration (spec 0009/0001 AC-2).
#
#   uv run alembic upgrade head
#   uv run alembic downgrade base
#   uv run alembic check
#
# The DSN is never stored here: backend/alembic/env.py reads
# ENERGYIQ_MIGRATION_DATABASE_URL (the migrator role) through Settings.

[alembic]
script_location = %(here)s/backend/alembic
prepend_sys_path = %(here)s/backend/src
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
